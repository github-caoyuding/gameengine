# ========================================
# Database Configuration for MySQL
# ========================================
# Please configure your MySQL database connection information here

# MySQL Database URL
# Format: jdbc:mysql://[host]:[port]/[database]?[parameters]
# Example: jdbc:mysql://localhost:3306/gameengine?useSSL=false&serverTimezone=UTC
db.url=jdbc:mysql://localhost:3306/gameengine?useSSL=false&serverTimezone=UTC&characterEncoding=utf8

# MySQL Database username (default: root)
db.username=root

# MySQL Database password
db.password=

# JDBC Driver class name (for MySQL 8.x)
db.driver=com.mysql.cj.jdbc.Driver

# Connection pool settings (optional)
db.initialSize=5
db.maxActive=10
db.maxWait=3000

# ========================================
# Configuration Instructions:
# ========================================
# 1. Create database: mysql -u root -p < sql/init.sql
# 2. Set db.password to your MySQL root password
# 3. Download MySQL Connector/J from: https://dev.mysql.com/downloads/connector/j/
# 4. Add the JAR file to classpath when running
#
# For other databases (PostgreSQL/SQLite), see sql/README.md

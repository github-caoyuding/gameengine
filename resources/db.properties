# Database Configuration
# Please configure your database connection information here

# Database URL (example: jdbc:mysql://localhost:3306/gameengine)
db.url=

# Database username
db.username=

# Database password
db.password=

# JDBC Driver class name
# For MySQL: com.mysql.cj.jdbc.Driver
# For PostgreSQL: org.postgresql.Driver
# For SQLite: org.sqlite.JDBC
db.driver=com.mysql.cj.jdbc.Driver

# Connection pool settings
db.initialSize=5
db.maxActive=10
db.maxWait=3000
